name: MAIN public deployment

on:
  push:
    branches: [main]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

env:
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json
  BUILD_CONFIGURATION: "Release"
  MinVerMinimumMajorMinor: "1.0"
  MinVerTagPrefix: "v"
  MinVerDefaultPreReleaseIdentifiers: "preview.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup .NET SDKs (both .NET 8 and .NET 10)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Run dotnet build and test
      - name: dotnet build and test
        run: |
          dotnet restore
          dotnet build --configuration '${{ env.BUILD_CONFIGURATION }}'
          dotnet test tests/UnitTests/DataflowBuilder.UnitTests.csproj --configuration '${{ env.BUILD_CONFIGURATION }}' --no-build

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC token generation for NuGet Trusted Publishing
      contents: read
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup .NET SDKs
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Run dotnet build and pack
      - name: dotnet build and pack
        run: |
          dotnet restore
          dotnet build --configuration '${{ env.BUILD_CONFIGURATION }}'
          dotnet pack -c '${{ env.BUILD_CONFIGURATION }}' --no-build

      # Exchange GitHub Actions OIDC token for short-lived NuGet.org API key
      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Evodim' }}

      # Publish the package to NuGet.org
      - name: "dotnet nuget push"
        run: dotnet nuget push "src/DotnetKit.*/bin/Release/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
