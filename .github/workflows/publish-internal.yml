name: PR internal deployment

on:
  pull_request:
    branches: [main]
env:
  GITHUB_ARTIFACTS_FEED_URL: https://nuget.pkg.github.com/DotnetKit/index.json
  BUILD_CONFIGURATION: "Release"
  MinVerMinimumMajorMinor: "1.0"
  MinVerTagPrefix: "v"
  MinVerDefaultPreReleaseIdentifiers: "alpha.${{ github.run_number }}.0"

jobs:
  gh-build-and-deploy-internal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup .NET SDKs
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Setup github package feed
      - name: dotnet nuget add source
        env:
          USERNAME: Evodim
        run: |
          dotnet nuget add source --username medevod --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github '${{ env.GITHUB_ARTIFACTS_FEED_URL }}'

      # Run dotnet build and pack
      - name: dotnet build and publish
        run: |
          dotnet restore
          dotnet build --configuration '${{ env.BUILD_CONFIGURATION }}'
          dotnet pack -c '${{ env.BUILD_CONFIGURATION }}' --no-build

      # Publish the package to GitHub Packages
      - name: "dotnet publish"
        run: dotnet nuget push src/DotnetKit.*/bin/Release/*.nupkg --source github --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
